include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - test_supabase_connection.dart
    - tool/**
  errors:
    # Deshabilitar warning de deprecated_member_use para withOpacity
    # Preferimos withOpacity() por simplicidad sobre withValues(alpha:)
    deprecated_member_use: ignore
    
linter:
  rules:
    # Deshabilitar reglas de estilo que generan muchos warnings innecesarios
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_const_constructors_in_immutables: false
    prefer_const_declarations: false
    use_build_context_synchronously: false
    avoid_print: false
    unnecessary_const: false
    unnecessary_new: false
